name: Build MLBB AI Draft APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kod Repository
        uses: actions/checkout@v4
      - name: Unzip Project Jika Ada ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            rm -rf temp_unzip && mkdir temp_unzip
            unzip -o "$ZIP_FILE" -d temp_unzip
            cp -r temp_unzip/. .
            rm -rf temp_unzip "$ZIP_FILE"
          fi
          if [ ! -f "./gradlew" ]; then
            GRADLEW_PATH=$(find . -type f -name "gradlew" | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              PROJECT_DIR=$(dirname "$GRADLEW_PATH")
              cp -r "$PROJECT_DIR"/. .
            fi
          fi
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Guna Android SDK Yang Dah Ada Dalam Runner
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          ls $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
      - name: Beri Permission Gradle
        run: chmod +x ./gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-Draft-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
