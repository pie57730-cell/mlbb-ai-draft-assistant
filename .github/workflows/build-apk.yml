name: Build MLBB AI Draft APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kod Repository
        uses: actions/checkout@v4

      - name: Unzip Project Jika Ada ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d temp_unzip
            shopt -s dotglob
            mv temp_unzip/* . 2>/dev/null || true
            mv temp_unzip/.* . 2>/dev/null || true
            rm -rf temp_unzip "$ZIP_FILE"
          fi
          # Jika gradlew masih dalam subfolder
          if [ ! -f "./gradlew" ]; then
            DIR=$(find . -maxdepth 3 -name "gradlew" | head -n 1 | xargs dirname)
            if [ -n "$DIR" ] && [ "$DIR" != "." ]; then
              echo "Pindah dari $DIR ke root"
              cp -r $DIR/* . 2>/dev/null || true
              cp -r $DIR/.* . 2>/dev/null || true
            fi
          fi
          ls -la

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform & Accept Licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Beri Permission Gradle
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-Draft-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error 
