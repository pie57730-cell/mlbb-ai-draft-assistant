name: Build MLBB AI Draft APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kod Repository
        uses: actions/checkout@v4

      - name: Unzip Project Jika Ada ZIP
        run: |
          set -x
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE"
            rm -rf temp_unzip
            mkdir temp_unzip
            unzip -o "$ZIP_FILE" -d temp_unzip
            # Pindahkan semua fail ke root
            cp -r temp_unzip/. .
            rm -rf temp_unzip "$ZIP_FILE"
          fi
          # Cari gradlew jika masih dalam subfolder
          if [ ! -f "./gradlew" ]; then
            GRADLEW_PATH=$(find . -type f -name "gradlew" | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              PROJECT_DIR=$(dirname "$GRADLEW_PATH")
              echo "Projek dijumpai di $PROJECT_DIR"
              cp -r "$PROJECT_DIR"/. .
            fi
          fi
          ls -la
          ls -la app/ || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform & Accept Licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Beri Permission Gradle
        run: chmod +x ./gradlew || chmod +x ./gradlew.bat || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-Draft-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
