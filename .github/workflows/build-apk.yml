name: Build MLBB AI Draft Assistant APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "17"
      ANDROID_COMPILE_SDK: "34"
      ANDROID_BUILD_TOOLS: "34.0.0"

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Extract ZIP if present
        shell: bash
        run: |
          set -eux
          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            echo "Zip file found: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d .
          else
            echo "No ZIP file found. Continuing with existing repo files."
          fi

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: 5. Accept SDK licenses and install Android packages
        shell: bash
        run: |
          set -eux
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" \
                     "platforms;android-${ANDROID_COMPILE_SDK}" \
                     "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: 6. Find Android project and build APK
        shell: bash
        run: |
          set -eux

          GRADLEW_PATH=$(find . -type f -name "gradlew" | head -n 1 || true)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found."
            echo "Checking repo structure:"
            find . -maxdepth 5 -type f | sed 's#^./##' | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Android project found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 7. Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-AI-Draft-Assistant-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
