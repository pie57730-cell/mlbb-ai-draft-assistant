          """)

          write_file("app/src/main/java/com/mlbb/aidraft/data/remote/HeroSyncRepository.kt", """
              package com.mlbb.aidraft.data.remote

              import com.google.gson.Gson
              import com.google.gson.reflect.TypeToken
              import com.mlbb.aidraft.data.local.AppDatabase
              import com.mlbb.aidraft.data.local.HeroDao
              import com.mlbb.aidraft.data.local.HeroEntity
              import kotlinx.coroutines.Dispatchers
              import kotlinx.coroutines.withContext
              import java.net.HttpURLConnection
              import java.net.URL

              class HeroSyncRepository(private val heroDao: HeroDao) {
                  suspend fun ensureSeeded() = withContext(Dispatchers.IO) {
                      if (heroDao.getCount() == 0) {
                          heroDao.insertAll(AppDatabase.getInitialMetaHeroes())
                      }
                  }

                  suspend fun syncFromRemoteJson(rawJsonUrl: String): Result<Int> = withContext(Dispatchers.IO) {
                      try {
                          val connection = (URL(rawJsonUrl).openConnection() as HttpURLConnection).apply {
                              requestMethod = "GET"
                              connectTimeout = 8000
                              readTimeout = 8000
                          }
                          if (connection.responseCode == HttpURLConnection.HTTP_OK) {
                              val jsonText = connection.inputStream.bufferedReader().use { it.readText() }
                              val listType = object : TypeToken<List<HeroEntity>>() {}.type
                              val updatedHeroes: List<HeroEntity> = Gson().fromJson(jsonText, listType)
                              heroDao.clearAll()
                              heroDao.insertAll(updatedHeroes)
                              Result.success(updatedHeroes.size)
                          } else {
                              Result.failure(Exception("HTTP \\${connection.responseCode}"))
                          }
                      } catch (e: Exception) {
                          Result.failure(e)
                      }
                  }
              }
          """)

          write_file("app/src/main/java/com/mlbb/aidraft/domain/vision/HeroRecognizer.kt", """
              package com.mlbb.aidraft.domain.vision

              import android.graphics.Bitmap
              import android.graphics.Color
              import com.google.mlkit.vision.common.InputImage
              import com.google.mlkit.vision.text.TextRecognition
              import com.google.mlkit.vision.text.latin.TextRecognizerOptions
              import com.mlbb.aidraft.data.local.HeroEntity
              import com.mlbb.aidraft.domain.model.RecognizedHeroSlot
              import kotlinx.coroutines.tasks.await
              import kotlin.math.max
              import kotlin.math.min

              class HeroRecognizer {
                  private val ocrClient = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)

                  companion object {
                      private const val CONFIDENCE_THRESHOLD = 0.72f
                  }

                  suspend fun recognizeDraftScreen(
                      fullScreenshot: Bitmap,
                      heroDatabase: List<HeroEntity>
                  ): Pair<List<RecognizedHeroSlot>, List<RecognizedHeroSlot>> {
                      val allies = mutableListOf<RecognizedHeroSlot>()
                      val enemies = mutableListOf<RecognizedHeroSlot>()
                      val slotYFractions = listOf(0.16f, 0.29f, 0.42f, 0.55f, 0.68f)

                      for (i in 0 until 5) {
                          val crop = cropNormalized(fullScreenshot, 0.01f, slotYFractions[i], 0.14f, 0.11f)
                          allies.add(identifySingleSlot(crop, i, true, heroDatabase))
                      }
                      for (i in 0 until 5) {
                          val crop = cropNormalized(fullScreenshot, 0.85f, slotYFractions[i], 0.14f, 0.11f)
                          enemies.add(identifySingleSlot(crop, i + 5, false, heroDatabase))
                      }
                      return Pair(allies, enemies)
                  }

                  private suspend fun identifySingleSlot(
                      slotBitmap: Bitmap,
                      slotIndex: Int,
                      isAlly: Boolean,
                      heroDatabase: List<HeroEntity>
                  ): RecognizedHeroSlot {
                      val detectedText = runOcrOnSlot(slotBitmap)
                      var bestHero: HeroEntity? = null
                      var highestConfidence = 0.0f

                      if (detectedText.isNotBlank()) {
                          for (hero in heroDatabase) {
                              val textSim = calculateNameSimilarity(detectedText, hero.name)
                              if (textSim > highestConfidence) {
                                  highestConfidence = textSim
                                  bestHero = hero
                              }
                          }
                      }

                      val slotHash = computeDHash64(slotBitmap)
                      for (hero in heroDatabase) {
                          val visualSim = compareDHashSimilarity(slotHash, hero.portraitHash)
                          val combinedScore = if (bestHero?.id == hero.id) {
                              max(highestConfidence, (highestConfidence * 0.6f) + (visualSim * 0.4f))
                          } else {
                              visualSim
                          }
                          if (combinedScore > highestConfidence) {
                              highestConfidence = combinedScore
                              bestHero = hero
                          }
                      }

                      return if (bestHero != null && highestConfidence >= CONFIDENCE_THRESHOLD) {
                          RecognizedHeroSlot(slotIndex, isAlly, bestHero.id, bestHero.name, highestConfidence, bestHero.role)
                      } else {
                          RecognizedHeroSlot(slotIndex, isAlly, null, "Unknown Hero", highestConfidence, "Unknown")
                      }
                  }

                  private suspend fun runOcrOnSlot(bitmap: Bitmap): String {
                      return try {
                          val image = InputImage.fromBitmap(bitmap, 0)
                          val result = ocrClient.process(image).await()
                          result.textBlocks.joinToString(" ") { it.text }.trim()
                      } catch (e: Exception) {
                          ""
                      }
                  }

                  fun computeDHash64(bitmap: Bitmap): Long {
                      val resized = Bitmap.createScaledBitmap(bitmap, 9, 8, true)
                      var hash = 0L
                      var bitIndex = 0
                      for (y in 0 until 8) {
                          for (x in 0 until 8) {
                              val leftLum = getLuminance(resized.getPixel(x, y))
                              val ri
