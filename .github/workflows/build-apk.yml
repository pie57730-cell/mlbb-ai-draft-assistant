name: Build MLBB AI Draft APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kod Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Suntik GEMINI_API_KEY ke dalam local.properties
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_KEY" >> local.properties

      - name: Bina Debug APK dengan Gradle
        run: gradle assembleDebug --stacktrace

      - name: Simpan APK sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlbb-ai-draft-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
