name: Build MLBB AI Draft Assistant APKon:  push:    branches:      - main      - master  workflow_dispatch:jobs:  build:    runs-on: ubuntu-latest    steps:      - name: 1. Semak Keluar Kod Repositori        uses: actions/checkout@v4      - name: 2. Ekstrak Fail ZIP Projek (Jika Ada)        run: |          shopt -s nullglob          zip_files=(*.zip)          if [ ${#zip_files[@]} -gt 0 ]; then            echo "Menjumpai fail ZIP: ${zip_files[0]}"            unzip -q -o "${zip_files[0]}" -d .          else            echo "Tiada fail ZIP dijumpai, meneruskan dengan fail sedia ada."          fi      - name: 3. Tetapkan Java JDK 17        uses: actions/setup-java@v4        with:          distribution: 'temurin'          java-version: '17'      - name: 4. Sediakan Android SDK dan Terima Lesen        uses: android-actions/setup-android@v3        with:          cmdline-tools-version: 11076708      - name: 5. Luluskan Lesen SDK dan Pasang Platform Tools        run: |          yes | sdkmanager --licenses || true          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"      - name: 6. Cari Folder Projek dan Bina APK Debug        run: |          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)          if [ -z "$GRADLEW_PATH" ]; then            echo "Ralat: Fail gradlew tidak dijumpai di dalam repositori atau ZIP!"            exit 1          fi          PROJECT_DIR=$(dirname "$GRADLEW_PATH")          echo "Projek dijumpai di: $PROJECT_DIR"          cd "$PROJECT_DIR"          chmod +x gradlew          ./gradlew assembleDebug --no-daemon --stacktrace      - name: 7. Muat Naik APK ke GitHub Artifacts        uses: actions/upload-artifact@v4        with:          name: MLBB-AI-Draft-Assistant-Debug-APK          path: '**/build/outputs/apk/debug/*-debug.apk'          if-no-files-found: error
