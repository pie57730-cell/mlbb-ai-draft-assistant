name: Build MLBB AI Draft APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kod Repository
        uses: actions/checkout@v4

      - name: Unzip Dan Cari Projek Sebenar
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Jumpa ZIP: $ZIP_FILE"
            rm -rf temp_unzip && mkdir temp_unzip
            unzip -o "$ZIP_FILE" -d temp_unzip
            cp -r temp_unzip/. .
            rm -rf temp_unzip "$ZIP_FILE"
          fi
          PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname 2>/dev/null || true)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname 2>/dev/null || true)
          fi
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Projek di: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Betulkan Gradle Wrapper Ke 8.9
        run: |
          cd "$PROJECT_DIR"
          WRAPPER_FILE=$(find . -name "gradle-wrapper.properties" | head -n 1)
          if [ -n "$WRAPPER_FILE" ]; then
            echo "Jumpa wrapper: $WRAPPER_FILE"
            cat "$WRAPPER_FILE"
            sed -i 's|gradle-.*-all.zip|gradle-8.9-all.zip|g' "$WRAPPER_FILE"
            sed -i 's|gradle-.*-bin.zip|gradle-8.9-bin.zip|g' "$WRAPPER_FILE"
            echo "--- Selepas betulkan ---"
            cat "$WRAPPER_FILE"
          else
            echo "Tiada wrapper file, akan guna Gradle 8.9 terus"
          fi

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          echo "Build dari: $(pwd)"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          if [ -f "./gradlew" ]; then
            echo "Guna gradlew (sekarang 8.9)"
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "gradlew tiada, guna gradle 8.9 terus"
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Cari Dan Upload APK
        run: |
          find . -name "*.apk"
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-Draft-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: errorw
